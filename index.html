<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador — CEP e Pokémon</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <h1>Buscador de CEP e Pokémon</h1>

    <section class="card">
        <h2>Buscar Endereço por CEP</h2>
        <input type="text" id="cep" placeholder="Digite o CEP (apenas números)" maxlength="9">
        <button id="btnBuscar">Buscar CEP</button>
        <p class="carregando" id="carregandoCep">Buscando endereço...</p>
        <div class="erro" id="erroCep"></div>
        <div id="resultadoCep"></div>
    </section>

    <br><br>

    <section class="card">
        <h2>Buscar Pokémon</h2>
        <input type="text" id="pokemon" placeholder="Nome ou número">
        <button id="btnBuscarPoke">Buscar Pokémon</button>
        <p class="carregando" id="carregandoPoke">Buscando Pokémon...</p>
        <div class="erro" id="erroPoke"></div>
        <div id="resultadoPoke"></div>
    </section>

    <br><br>

   <section class="card">
        <h2> Cadastrar Pokémon no Banco</h2>
        <form id="formCadastro">
            <div>
                <label>Nome:</label>
                <input type="text" id="nome" required>
            </div>
            <div>
                <label>Tipo:</label>
                <input type="text" id="tipo" required>
            </div>
            <div>
                <label>Altura (m):</label>
                <input type="number" step="0.01" id="altura" required>
            </div>
            <div>
                <label>Peso (kg):</label>
                <input type="number" step="0.01" id="peso" required>
            </div>
            <button type="submit">Cadastrar</button>
        </form>
        <p id="mensagemCadastro"></p>
    </section>

    <section class="card">
        <h2>Pokémons Cadastrados</h2>
        <button id="btnAtualizar"> Atualizar Lista</button>
        <div id="listaBanco"></div>
    </section>

    <button id="btnLimpar">Limpar Tudo</button>

    <script src="script.js"></script>
</body>
</html>
